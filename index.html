function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function buildSidebar(){

  });
  var cats=Object.keys(plats).sort(function(a,b){return catOrder(a)-catOrder(b);});

  html+='<div class="plat-head side-all active" data-cat="all" data-genre="">'+t("all")+' <span class="num">'+GAMES.length+'</span></div>';
  cats.forEach(function(c){
    html+='<div class="plat-group" data-group="'+c+'">';

    var genres=Object.keys(plats[c].genres).sort();
    if(genres.length||plats[c].nogenre){
      html+='<div class="genre-list">';
      genres.forEach(function(gn){
        html+='<div class="genre-item" data-cat="'+c+'" data-genre="'+esc(gn)+'">'+esc(gn)+' <span class="num">'+plats[c].genres[gn]+'</span></div>';
      });
      if(plats[c].nogenre){html+='<div class="genre-item" data-cat="'+c+'" data-genre="__unclassified__">'+t("uncat")+' <span class="num">'+plats[c].nogenre+'</span></div>';}
      html+='</div>';
    }
    html+='</div>';
  });
  sidebar.innerHTML=html;

    el.addEventListener("click",function(){
      var cat=el.dataset.cat,gn=el.dataset.genre||"";
      if(el.classList.contains("plat-head")&&cat!=="all"){
        var grp=sidebar.querySelector('.plat-group[data-group="'+cat+'"]');
        if(grp){var wasOpen=grp.classList.contains("open");
          sidebar.querySelectorAll(".plat-group").forEach(function(x){x.classList.remove("open");});
          if(!wasOpen)grp.classList.add("open");}

      currentCat=cat;currentGenre=gn;

      el.classList.add("active");
      applyFilter();
    });
  });

function cardHtml(g){

  var overlayControls='<button class="fav-btn'+(favs.has(g.id)?" on":"")+'" data-fav="'+g.id+'" aria-label="즐겨찾기 토글">'+(favs.has(g.id)?"★":"☆")+'</button>'+info;

      '<div class="card-overlay">'+t("play")+'</div>'+

      (sn?'<div class="card-en-title">'+esc(sn.enTitle)+'</div>':"")+

    '</div></a></div>';

function isSectionMode(){return !currentGenre&&!favOnly&&!mobileOnly&&!filter.value.trim();}
function renderSections(catOnly){
  var hideSmall=(catOnly===null);
  var byCat={};
  GAMES.forEach(function(g){var c=g.category||"other";if(catOnly&&c!==catOnly)return;var gn=g.genre||"__none__";if(!byCat[c])byCat[c]={};if(!byCat[c][gn])byCat[c][gn]=[];byCat[c][gn].push(g);});
  var cats=Object.keys(byCat).sort(function(a,b){return catOrder(a)-catOrder(b);});
  var html="",total=0;
  cats.forEach(function(c){
    var genres=Object.keys(byCat[c]).sort(function(a,b){if(a==="__none__")return 1;if(b==="__none__")return -1;return a.localeCompare(b);});
    var catCount=0;genres.forEach(function(gn){catCount+=byCat[c][gn].length;});
    var inner="";
    var fpool=GAMES.filter(function(g){return (g.category||"other")===c&&favs.has(g.id);});
      if(fpool.length){
        var ftop=fpool.slice().sort(function(x,y){return (y.dl||0)-(x.dl||0);}).slice(0,SECTION_TOP);
        total+=ftop.length;
        inner+='<div class="genre-block"><h3 class="genre-title">\u2b50 '+t("fav")+' <span class="num">'+fpool.length+'</span></h3><div class="grid '+CARD_CLASS+'">'+ftop.map(cardHtml).join("")+'</div></div>';
      }
    if(catOnly){
    genres.forEach(function(gn){
      var arr=byCat[c][gn];
      if(hideSmall&&arr.length<SECTION_TOP)return;
      var pool=arr.slice().sort(function(x,y){return (y.dl||0)-(x.dl||0);}).slice(0,100);
      for(var _i=pool.length-1;_i>0;_i--){var _j=Math.floor(Math.random()*(_i+1));var _t=pool[_i];pool[_i]=pool[_j];pool[_j]=_t;}
      var top=pool.slice(0,SECTION_TOP);
      total+=top.length;
      var gname=(gn==="__none__")?"Unclassified":esc(gn);
      inner+='<div class="genre-block"><h3 class="genre-title">'+gname+' <span class="num">'+arr.length+'</span></h3><div class="grid '+CARD_CLASS+'">'+top.map(cardHtml).join("")+'</div></div>';
    });
    }
    if(!inner)return;
    html+='<section class="platform-section"><h2 class="platform-title" style="--pc:'+catColor(c)+'">'+esc(catShort(c))+' <span class="ps-count">'+catCount+'</span></h2>'+inner+'</section>';
  });
  grid.className="";grid.innerHTML=html;_resetMore();
  visibleCount.textContent=total;empty.style.display=total?"none":"block";
}
function renderFavSections(catOnly){
  var byCat={};
  GAMES.forEach(function(g){if(!favs.has(g.id))return;var c=g.category||"other";if(catOnly&&c!==catOnly)return;if(!byCat[c])byCat[c]=[];byCat[c].push(g);});
  var cats=Object.keys(byCat).sort(function(a,b){return catOrder(a)-catOrder(b);});
  var html="",total=0;
  cats.forEach(function(c){
    var arr=byCat[c].slice().sort(function(x,y){return (y.dl||0)-(x.dl||0);});
    total+=arr.length;
    html+='<section class="platform-section"><h2 class="platform-title" style="--pc:'+catColor(c)+'">\u2b50 '+esc(catShort(c))+' <span class="ps-count">'+arr.length+'</span></h2><div class="grid '+CARD_CLASS+'">'+arr.map(cardHtml).join("")+'</div></section>';
  });
  grid.className="";grid.innerHTML=html;_resetMore();
  visibleCount.textContent=total;empty.style.display=total?"none":"block";
}
function applyFilter(){
  if(favOnly&&!currentGenre&&!filter.value.trim()){renderFavSections(currentCat==="all"?null:currentCat);return;}
  if(isSectionMode()){renderSections(currentCat==="all"?null:currentCat);return;}
  var q=filter.value.toLowerCase().trim();
  var items=GAMES.filter(function(g){
    if(favOnly&&!favs.has(g.id))return false;
    if(mobileOnly&&!mobileCapable(g))return false;
    if(currentCat!=="all"&&(g.category||"other")!==currentCat)return false;
    if(currentGenre){if(currentGenre==="__unclassified__"){if(g.genre)return false;}else if((g.genre||"")!==currentGenre)return false;}
    if(q){var n=seoName(g);var hay=(g.title+" "+(n?n.koTitle+" "+n.enTitle:"")).toLowerCase();return hay.indexOf(q)>=0;}
    return true;
  });
  items=items.slice();
  if(sortMode==="name")items.sort(function(x,y){return x.title.localeCompare(y.title);});
  else if(sortMode==="year")items.sort(function(x,y){return (parseInt(x.year)||0)-(parseInt(y.year)||0);});
  else if(sortMode==="popular")items.sort(function(x,y){return (y.dl||0)-(x.dl||0);});
  else if(sortMode==="random")items.sort(function(){return Math.random()-0.5;});
  render(items);
}
var PAGE_SIZE=60,_pageItems=[],_pageShown=0;
function render(items){
  grid.className="grid "+CARD_CLASS;

function renderMore(){
  var mb=document.getElementById("more");
  if(_pageShown>=_pageItems.length){if(mb)mb.style.display="none";return;}
  var next=_pageItems.slice(_pageShown,_pageShown+PAGE_SIZE);
  _pageShown+=next.length;
  grid.insertAdjacentHTML("beforeend",next.map(cardHtml).join(""));
  if(mb)mb.style.display=(_pageShown<_pageItems.length)?"block":"none";
}
function _resetMore(){_pageItems=[];_pageShown=0;var mb=document.getElementById("more");if(mb)mb.style.display="none";}
